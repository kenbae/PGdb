<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keltner ICT Turtle Backtester</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function BacktestApp() {
            // 상태 관리
            const [symbols, setSymbols] = useState([]);
            const [selectedSymbols, setSelectedSymbols] = useState([]);
            const [searchTerm, setSearchTerm] = useState('');
            const [timeframes, setTimeframes] = useState(['1h']);
            const [startDate, setStartDate] = useState('2023-01-01');
            const [endDate, setEndDate] = useState('2024-01-01');
            const [capital, setCapital] = useState(10000);
            const [topN, setTopN] = useState(10);
            const [useTopN, setUseTopN] = useState(false);
            const [loading, setLoading] = useState(false);
            const [results, setResults] = useState([]);
            const [showResults, setShowResults] = useState(false);
            const [progress, setProgress] = useState({ current: 0, total: 0 });

            // 심볼 목록 로드
            useEffect(() => {
                fetchSymbols();
            }, []);

            const fetchSymbols = async () => {
                try {
                    const response = await fetch('/api/symbols');
                    const data = await response.json();
                    setSymbols(data.symbols || []);
                } catch (error) {
                    console.error('심볼 로드 실패:', error);
                }
            };

            // 심볼 검색
            const filteredSymbols = symbols.filter(s => 
                s.symbol.toLowerCase().includes(searchTerm.toLowerCase())
            );

            // 심볼 선택/해제
            const toggleSymbol = (symbol) => {
                if (selectedSymbols.includes(symbol)) {
                    setSelectedSymbols(selectedSymbols.filter(s => s !== symbol));
                } else {
                    setSelectedSymbols([...selectedSymbols, symbol]);
                }
            };

            // 전체 선택/해제
            const toggleAll = () => {
                if (selectedSymbols.length === filteredSymbols.length) {
                    setSelectedSymbols([]);
                } else {
                    setSelectedSymbols(filteredSymbols.map(s => s.symbol));
                }
            };

            // TF 토글
            const toggleTimeframe = (tf) => {
                if (selectedSymbols.length > 1) {
                    // 복수 심볼: 단일 TF만
                    setTimeframes([tf]);
                } else {
                    // 단일 심볼: 복수 TF 가능
                    if (timeframes.includes(tf)) {
                        setTimeframes(timeframes.filter(t => t !== tf));
                    } else {
                        setTimeframes([...timeframes, tf]);
                    }
                }
            };

            // 백테스트 실행
            const runBacktest = async () => {
                setLoading(true);
                setResults([]);
                setShowResults(false);

                try {
                    const symbolsToTest = useTopN 
                        ? symbols.slice(0, topN).map(s => s.symbol)
                        : selectedSymbols;

                    const totalTests = symbolsToTest.length * timeframes.length;
                    setProgress({ current: 0, total: totalTests });

                    const response = await fetch('/api/backtest', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            symbols: symbolsToTest,
                            timeframes: timeframes,
                            start_date: startDate,
                            end_date: endDate,
                            initial_capital: capital
                        })
                    });

                    if (!response.ok) {
                        throw new Error('백테스트 실패');
                    }

                    // 스트리밍으로 진행상황 받기
                    const reader = response.body.getReader();
                    const decoder = new TextDecoder();
                    let buffer = '';

                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;

                        buffer += decoder.decode(value, { stream: true });
                        const lines = buffer.split('\n');
                        buffer = lines.pop();

                        for (const line of lines) {
                            if (line.startsWith('data: ')) {
                                const data = JSON.parse(line.slice(6));
                                
                                if (data.type === 'progress') {
                                    setProgress({ current: data.current, total: data.total });
                                } else if (data.type === 'result') {
                                    setResults(prev => [...prev, data.result]);
                                }
                            }
                        }
                    }

                    setShowResults(true);
                } catch (error) {
                    console.error('백테스트 오류:', error);
                    alert('백테스트 실패: ' + error.message);
                } finally {
                    setLoading(false);
                }
            };

            // 결과 정렬 (수익률 높은 순)
            const sortedResults = [...results].sort((a, b) => 
                b.total_pnl_pct - a.total_pnl_pct
            );

            return (
                <div className="min-h-screen bg-gray-100 p-4">
                    <div className="max-w-7xl mx-auto">
                        {/* 헤더 */}
                        <div className="bg-gradient-to-r from-blue-600 to-purple-600 text-white p-6 rounded-lg shadow-lg mb-6">
                            <h1 className="text-4xl font-bold mb-2">🐢 Keltner ICT Turtle Backtester</h1>
                            <p className="text-blue-100">현대화된 터틀 트레이딩 전략 백테스트</p>
                        </div>

                        {/* 메인 컨텐츠 */}
                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                            {/* 왼쪽: 설정 */}
                            <div className="lg:col-span-1 space-y-4">
                                {/* 날짜 설정 */}
                                <div className="bg-white rounded-lg shadow p-4">
                                    <h3 className="font-bold text-lg mb-3">📅 기간 설정</h3>
                                    <div className="space-y-3">
                                        <div>
                                            <label className="block text-sm font-medium mb-1">시작일</label>
                                            <input
                                                type="date"
                                                value={startDate}
                                                onChange={(e) => setStartDate(e.target.value)}
                                                className="w-full border rounded px-3 py-2"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-medium mb-1">종료일</label>
                                            <input
                                                type="date"
                                                value={endDate}
                                                onChange={(e) => setEndDate(e.target.value)}
                                                className="w-full border rounded px-3 py-2"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-medium mb-1">초기 자본 ($)</label>
                                            <input
                                                type="number"
                                                value={capital}
                                                onChange={(e) => setCapital(Number(e.target.value))}
                                                className="w-full border rounded px-3 py-2"
                                            />
                                        </div>
                                    </div>
                                </div>

                                {/* 타임프레임 설정 */}
                                <div className="bg-white rounded-lg shadow p-4">
                                    <h3 className="font-bold text-lg mb-3">⏱️ 타임프레임</h3>
                                    {selectedSymbols.length > 1 && (
                                        <p className="text-sm text-orange-600 mb-2">
                                            ⚠️ 복수 심볼: 하나만 선택 가능
                                        </p>
                                    )}
                                    <div className="grid grid-cols-3 gap-2">
                                        {['15m', '30m', '1h', '4h', '1d'].map(tf => (
                                            <button
                                                key={tf}
                                                onClick={() => toggleTimeframe(tf)}
                                                className={`px-3 py-2 rounded font-medium transition ${
                                                    timeframes.includes(tf)
                                                        ? 'bg-blue-600 text-white'
                                                        : 'bg-gray-200 text-gray-700 hover:bg-gray-300'
                                                }`}
                                            >
                                                {tf}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                {/* 실행 버튼 */}
                                <button
                                    onClick={runBacktest}
                                    disabled={loading || (selectedSymbols.length === 0 && !useTopN) || timeframes.length === 0}
                                    className={`w-full py-4 rounded-lg font-bold text-lg transition ${
                                        loading || (selectedSymbols.length === 0 && !useTopN) || timeframes.length === 0
                                            ? 'bg-gray-300 text-gray-500 cursor-not-allowed'
                                            : 'bg-gradient-to-r from-green-500 to-green-600 text-white hover:from-green-600 hover:to-green-700 shadow-lg'
                                    }`}
                                >
                                    {loading ? '🔄 백테스트 실행 중...' : '🚀 백테스트 시작'}
                                </button>

                                {/* 진행 상황 */}
                                {loading && (
                                    <div className="bg-white rounded-lg shadow p-4">
                                        <div className="mb-2 flex justify-between text-sm">
                                            <span>진행률</span>
                                            <span>{progress.current} / {progress.total}</span>
                                        </div>
                                        <div className="w-full bg-gray-200 rounded-full h-4">
                                            <div
                                                className="bg-blue-600 h-4 rounded-full transition-all"
                                                style={{ width: `${(progress.current / progress.total) * 100}%` }}
                                            />
                                        </div>
                                    </div>
                                )}
                            </div>

                            {/* 오른쪽: 심볼 선택 */}
                            <div className="lg:col-span-2 bg-white rounded-lg shadow p-4">
                                <h3 className="font-bold text-lg mb-3">📊 심볼 선택</h3>

                                {/* Top N 옵션 */}
                                <div className="mb-4 p-3 bg-blue-50 rounded-lg">
                                    <label className="flex items-center space-x-2">
                                        <input
                                            type="checkbox"
                                            checked={useTopN}
                                            onChange={(e) => setUseTopN(e.target.checked)}
                                            className="w-5 h-5"
                                        />
                                        <span className="font-medium">거래량 상위</span>
                                        <input
                                            type="number"
                                            value={topN}
                                            onChange={(e) => setTopN(Number(e.target.value))}
                                            disabled={!useTopN}
                                            className="w-20 border rounded px-2 py-1"
                                            min="1"
                                            max="50"
                                        />
                                        <span>개 심볼 사용</span>
                                    </label>
                                </div>

                                {!useTopN && (
                                    <>
                                        {/* 검색 */}
                                        <div className="mb-4">
                                            <input
                                                type="text"
                                                placeholder="심볼 검색..."
                                                value={searchTerm}
                                                onChange={(e) => setSearchTerm(e.target.value)}
                                                className="w-full border rounded-lg px-4 py-2"
                                            />
                                        </div>

                                        {/* 전체 선택/해제 */}
                                        <div className="mb-3 flex justify-between items-center">
                                            <span className="text-sm text-gray-600">
                                                {selectedSymbols.length}개 선택됨
                                            </span>
                                            <button
                                                onClick={toggleAll}
                                                className="text-sm text-blue-600 hover:text-blue-800 font-medium"
                                            >
                                                {selectedSymbols.length === filteredSymbols.length ? '전체 해제' : '전체 선택'}
                                            </button>
                                        </div>

                                        {/* 심볼 목록 */}
                                        <div className="max-h-96 overflow-y-auto border rounded-lg">
                                            {filteredSymbols.map((s, idx) => (
                                                <div
                                                    key={s.symbol}
                                                    onClick={() => toggleSymbol(s.symbol)}
                                                    className={`p-3 cursor-pointer transition flex justify-between items-center ${
                                                        idx % 2 === 0 ? 'bg-gray-50' : 'bg-white'
                                                    } ${
                                                        selectedSymbols.includes(s.symbol)
                                                            ? 'border-l-4 border-blue-600 bg-blue-50'
                                                            : 'hover:bg-gray-100'
                                                    }`}
                                                >
                                                    <div className="flex items-center space-x-3">
                                                        <input
                                                            type="checkbox"
                                                            checked={selectedSymbols.includes(s.symbol)}
                                                            readOnly
                                                            className="w-5 h-5"
                                                        />
                                                        <span className="font-medium">{s.symbol}</span>
                                                    </div>
                                                    <div className="text-sm text-gray-600">
                                                        {s.volume ? `${(s.volume / 1e6).toFixed(1)}M` : ''}
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </>
                                )}
                            </div>
                        </div>
                    </div>

                    {/* 결과 모달 */}
                    {showResults && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
                            <div className="bg-white rounded-lg shadow-2xl max-w-6xl w-full max-h-[90vh] overflow-hidden flex flex-col">
                                {/* 헤더 */}
                                <div className="bg-gradient-to-r from-blue-600 to-purple-600 text-white p-6 flex justify-between items-center">
                                    <h2 className="text-2xl font-bold">📊 백테스트 결과</h2>
                                    <button
                                        onClick={() => setShowResults(false)}
                                        className="text-white hover:text-gray-200 text-2xl font-bold"
                                    >
                                        ✕
                                    </button>
                                </div>

                                {/* 전체 요약 */}
                                {sortedResults.length > 1 && (
                                    <div className="p-6 bg-gray-50 border-b">
                                        <h3 className="font-bold text-lg mb-3">📈 전체 요약</h3>
                                        <div className="grid grid-cols-4 gap-4">
                                            <div className="bg-white p-3 rounded shadow">
                                                <div className="text-sm text-gray-600">테스트 수</div>
                                                <div className="text-2xl font-bold">{sortedResults.length}</div>
                                            </div>
                                            <div className="bg-white p-3 rounded shadow">
                                                <div className="text-sm text-gray-600">평균 수익률</div>
                                                <div className={`text-2xl font-bold ${
                                                    sortedResults.reduce((acc, r) => acc + r.total_pnl_pct, 0) / sortedResults.length > 0
                                                        ? 'text-green-600' : 'text-red-600'
                                                }`}>
                                                    {(sortedResults.reduce((acc, r) => acc + r.total_pnl_pct, 0) / sortedResults.length).toFixed(2)}%
                                                </div>
                                            </div>
                                            <div className="bg-white p-3 rounded shadow">
                                                <div className="text-sm text-gray-600">평균 승률</div>
                                                <div className="text-2xl font-bold">
                                                    {(sortedResults.reduce((acc, r) => acc + r.win_rate, 0) / sortedResults.length).toFixed(1)}%
                                                </div>
                                            </div>
                                            <div className="bg-white p-3 rounded shadow">
                                                <div className="text-sm text-gray-600">평균 샤프</div>
                                                <div className="text-2xl font-bold">
                                                    {(sortedResults.reduce((acc, r) => acc + r.sharpe_ratio, 0) / sortedResults.length).toFixed(2)}
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                )}

                                {/* 결과 목록 */}
                                <div className="flex-1 overflow-y-auto p-6">
                                    <div className="space-y-4">
                                        {sortedResults.map((result, idx) => (
                                            <ResultCard key={idx} result={result} rank={idx + 1} />
                                        ))}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // 결과 카드 컴포넌트
        function ResultCard({ result, rank }) {
            const [expanded, setExpanded] = useState(false);

            return (
                <div className="bg-white border-2 border-gray-200 rounded-lg shadow hover:shadow-lg transition">
                    {/* 요약 */}
                    <div
                        onClick={() => setExpanded(!expanded)}
                        className="p-4 cursor-pointer"
                    >
                        <div className="flex items-center justify-between">
                            <div className="flex items-center space-x-4">
                                {rank <= 3 && (
                                    <div className={`text-2xl ${
                                        rank === 1 ? '🥇' : rank === 2 ? '🥈' : '🥉'
                                    }`}>
                                        {rank === 1 ? '🥇' : rank === 2 ? '🥈' : '🥉'}
                                    </div>
                                )}
                                <div>
                                    <h4 className="text-xl font-bold">{result.symbol} - {result.tf}</h4>
                                    <p className="text-sm text-gray-600">
                                        {result.start_date} ~ {result.end_date}
                                    </p>
                                </div>
                            </div>
                            <div className="text-right">
                                <div className={`text-3xl font-bold ${
                                    result.total_pnl_pct > 0 ? 'text-green-600' : 'text-red-600'
                                }`}>
                                    {result.total_pnl_pct > 0 ? '+' : ''}{result.total_pnl_pct.toFixed(2)}%
                                </div>
                                <div className="text-sm text-gray-600">
                                    ${result.total_pnl.toFixed(2)}
                                </div>
                            </div>
                        </div>

                        {/* 주요 지표 */}
                        <div className="grid grid-cols-5 gap-4 mt-4">
                            <div>
                                <div className="text-xs text-gray-600">승률</div>
                                <div className="font-bold">{result.win_rate.toFixed(1)}%</div>
                            </div>
                            <div>
                                <div className="text-xs text-gray-600">총 거래</div>
                                <div className="font-bold">{result.total_trades}</div>
                            </div>
                            <div>
                                <div className="text-xs text-gray-600">샤프</div>
                                <div className="font-bold">{result.sharpe_ratio.toFixed(2)}</div>
                            </div>
                            <div>
                                <div className="text-xs text-gray-600">MDD</div>
                                <div className="font-bold text-red-600">{result.max_drawdown_pct.toFixed(2)}%</div>
                            </div>
                            <div>
                                <div className="text-xs text-gray-600">PF</div>
                                <div className="font-bold">{result.profit_factor.toFixed(2)}</div>
                            </div>
                        </div>
                    </div>

                    {/* 상세 정보 */}
                    {expanded && (
                        <div className="border-t p-4 bg-gray-50">
                            <div className="grid grid-cols-2 gap-6">
                                <div>
                                    <h5 className="font-bold mb-2">📊 거래 통계</h5>
                                    <div className="space-y-1 text-sm">
                                        <div className="flex justify-between">
                                            <span className="text-gray-600">승리/패배:</span>
                                            <span className="font-medium">{result.winning_trades} / {result.losing_trades}</span>
                                        </div>
                                        <div className="flex justify-between">
                                            <span className="text-gray-600">평균 수익:</span>
                                            <span className="font-medium text-green-600">${result.avg_win.toFixed(2)}</span>
                                        </div>
                                        <div className="flex justify-between">
                                            <span className="text-gray-600">평균 손실:</span>
                                            <span className="font-medium text-red-600">${result.avg_loss.toFixed(2)}</span>
                                        </div>
                                        <div className="flex justify-between">
                                            <span className="text-gray-600">최대 수익:</span>
                                            <span className="font-medium text-green-600">${result.max_win.toFixed(2)}</span>
                                        </div>
                                        <div className="flex justify-between">
                                            <span className="text-gray-600">최대 손실:</span>
                                            <span className="font-medium text-red-600">${result.max_loss.toFixed(2)}</span>
                                        </div>
                                    </div>
                                </div>
                                <div>
                                    <h5 className="font-bold mb-2">💰 자본 변화</h5>
                                    <div className="space-y-1 text-sm">
                                        <div className="flex justify-between">
                                            <span className="text-gray-600">초기 자본:</span>
                                            <span className="font-medium">${result.initial_capital.toFixed(2)}</span>
                                        </div>
                                        <div className="flex justify-between">
                                            <span className="text-gray-600">최종 자본:</span>
                                            <span className="font-medium">${result.final_capital.toFixed(2)}</span>
                                        </div>
                                        <div className="flex justify-between">
                                            <span className="text-gray-600">최대 낙폭:</span>
                                            <span className="font-medium text-red-600">${result.max_drawdown.toFixed(2)}</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // 앱 렌더링
        ReactDOM.render(<BacktestApp />, document.getElementById('root'));
    </script>
</body>
</html>
