<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function BacktestApp() {
            // 상태 관리
            const [symbols, setSymbols] = useState([]);
            const [strategies, setStrategies] = useState([]);
            const [selectedSymbols, setSelectedSymbols] = useState([]);
            const [selectedStrategies, setSelectedStrategies] = useState(['keltner_ict_turtle']);
            const [searchTerm, setSearchTerm] = useState('');
            const [timeframes, setTimeframes] = useState(['1h']);
            const [startDate, setStartDate] = useState('2024-01-01');
            const [endDate, setEndDate] = useState('2025-01-01');
            const [capital, setCapital] = useState(10000);
            // 옵션
            const [riskPct, setRiskPct] = useState(2.0);
            const [leverage, setLeverage] = useState(1.0);
            const [topN, setTopN] = useState(10);
            const [useTopN, setUseTopN] = useState(false);
            const [showTopNModal, setShowTopNModal] = useState(false);
            const [topNSelectedSymbols, setTopNSelectedSymbols] = useState([]);
            const [binanceSymbols, setBinanceSymbols] = useState([]);
            const [binanceLoading, setBinanceLoading] = useState(false);
            const [binanceUpdatedAt, setBinanceUpdatedAt] = useState(null);
            const [useBinanceList, setUseBinanceList] = useState(false);
            const [symbolSortMode, setSymbolSortMode] = useState('volume'); // 'volume' or 'price'
            // Pattern RAG 옵션
            const [patternRagLearnOnly, setPatternRagLearnOnly] = useState(false);
            const [patternRagLearning, setPatternRagLearning] = useState(false);
            const [patternRagLearnProgress, setPatternRagLearnProgress] = useState({ current: 0, total: 0, symbol: '' });
            const [loading, setLoading] = useState(false);
            const [results, setResults] = useState([]);
            const [showResults, setShowResults] = useState(false);
            const [progress, setProgress] = useState({ current: 0, total: 0, symbol: '', strategy: '' });
            // 차트 관련 상태
            const [showChart, setShowChart] = useState(false);
            const [chartData, setChartData] = useState(null);
            const [selectedResultForChart, setSelectedResultForChart] = useState(null);
            // Watch Symbols
            const [watchSymbols, setWatchSymbols] = useState([]);
            const [showWatchModal, setShowWatchModal] = useState(false);
            const [watchFilters, setWatchFilters] = useState({
                minPnlPct: 5.0,
                minWinRate: 50.0,
                minProfitFactor: 1.0
            });

            // 전략 설정 모달
            const [showStrategySettings, setShowStrategySettings] = useState(false);
            const [strategyConfigs, setStrategyConfigs] = useState({});
            const [editingStrategyConfig, setEditingStrategyConfig] = useState(null);
            // 전략 스키마 (동적 로드)
            const [strategySchemas, setStrategySchemas] = useState({});

            // 토스트 알림
            const [toasts, setToasts] = useState([]);
            const toastIdRef = React.useRef(0);

            // 토스트 표시 함수
            const showToast = (message, type = 'info', duration = 4000) => {
                const id = ++toastIdRef.current;
                const toast = { id, message, type };
                setToasts(prev => [...prev, toast]);

                // 자동 제거
                setTimeout(() => {
                    setToasts(prev => prev.filter(t => t.id !== id));
                }, duration);
            };

            // 토스트 수동 닫기
            const removeToast = (id) => {
                setToasts(prev => prev.filter(t => t.id !== id));
            };

            // 사이드바 박스 순서 관리
            const defaultBoxOrder = ['strategies', 'period', 'timeframe', 'runButton', 'progress'];
            const [boxOrder, setBoxOrder] = useState(() => {
                const saved = localStorage.getItem('backtester_box_order');
                return saved ? JSON.parse(saved) : defaultBoxOrder;
            });
            const [draggedBox, setDraggedBox] = useState(null);
            const [dragOverBox, setDragOverBox] = useState(null);

            // 박스 순서 저장
            useEffect(() => {
                localStorage.setItem('backtester_box_order', JSON.stringify(boxOrder));
            }, [boxOrder]);

            // 드래그 시작
            const handleDragStart = (e, boxId) => {
                setDraggedBox(boxId);
                e.dataTransfer.effectAllowed = 'move';
            };

            // 드래그 중
            const handleDragOver = (e, boxId) => {
                e.preventDefault();
                if (draggedBox && draggedBox !== boxId) {
                    setDragOverBox(boxId);
                }
            };

            // 드래그 종료
            const handleDragEnd = () => {
                setDraggedBox(null);
                setDragOverBox(null);
            };

            // 드롭
            const handleDrop = (e, targetBoxId) => {
                e.preventDefault();
                if (!draggedBox || draggedBox === targetBoxId) return;

                const newOrder = [...boxOrder];
                const draggedIndex = newOrder.indexOf(draggedBox);
                const targetIndex = newOrder.indexOf(targetBoxId);

                newOrder.splice(draggedIndex, 1);
                newOrder.splice(targetIndex, 0, draggedBox);

                setBoxOrder(newOrder);
                setDraggedBox(null);
                setDragOverBox(null);
            };

            // 초기 데이터 로드
            useEffect(() => {
                fetchSymbols();
                fetchStrategies();
                fetchWatchSymbols();
            }, []);

            // 차트 모달 이벤트 리스너
            useEffect(() => {
                const handleShowChart = (event) => {
                    const result = event.detail;
                    setSelectedResultForChart(result);
                    setShowChart(true);
                    loadChartData(result);
                };

                window.addEventListener('showChart', handleShowChart);
                return () => window.removeEventListener('showChart', handleShowChart);
            }, []);

            // 차트 데이터가 변경되면 다시 렌더링
            useEffect(() => {
                if (chartData && selectedResultForChart && showChart) {
                    const chartElement = document.getElementById('backtest-chart');
                    if (chartElement) {
                        setTimeout(() => {
                            renderChart(chartData.candles, chartData.trades, selectedResultForChart);
                        }, 200);
                    }
                }
            }, [chartData, selectedResultForChart, showChart]);

            // 차트 데이터가 변경되면 다시 렌더링
            useEffect(() => {
                if (chartData && selectedResultForChart && showChart) {
                    setTimeout(() => {
                        renderChart(chartData.candles, chartData.trades, selectedResultForChart);
                    }, 200);
                }
            }, [chartData, selectedResultForChart, showChart]);

            // 차트 데이터 로드
            const loadChartData = async (result) => {
                try {
                    setChartData(null);
                    
                    // 캔들 데이터 가져오기
                    const candlesResponse = await fetch(
                        `/api/candles?symbol=${result.symbol}&tf=${result.tf}&start_date=${result.start_date}&end_date=${result.end_date}`
                    );
                    const candlesData = await candlesResponse.json();
                    
                    if (!candlesData.success || !candlesData.candles) {
                        throw new Error('캔들 데이터를 가져올 수 없습니다.');
                    }

                    // 차트 데이터 저장 (렌더링은 useEffect에서 처리)
                    setChartData({ candles: candlesData.candles, trades: result.trades || [] });
                } catch (error) {
                    console.error('차트 데이터 로드 오류:', error);
                    showToast('차트 데이터 로드 실패: ' + error.message, 'error');
                }
            };

            // 차트 렌더링 함수
            const renderChart = (candles, trades, result) => {
                if (!window.Plotly) {
                    console.error('Plotly가 로드되지 않았습니다.');
                    return;
                }

                const chartElement = document.getElementById('backtest-chart');
                if (!chartElement) {
                    console.error('차트 요소를 찾을 수 없습니다.');
                    return;
                }

                // 캔들 데이터 준비
                const times = candles.map(c => c.time);
                const opens = candles.map(c => c.open);
                const highs = candles.map(c => c.high);
                const lows = candles.map(c => c.low);
                const closes = candles.map(c => c.close);
                const volumes = candles.map(c => c.volume);

                // 캔들스틱 트레이스
                const candlestickTrace = {
                    x: times,
                    open: opens,
                    high: highs,
                    low: lows,
                    close: closes,
                    type: 'candlestick',
                    name: 'Price',
                    increasing: { line: { color: '#0ecb81' } },
                    decreasing: { line: { color: '#f6465d' } }
                };

                const traces = [candlestickTrace];

                // 진입 포인트
                const entryTimes = [];
                const entryPrices = [];
                const entryDirections = [];
                trades.forEach(trade => {
                    if (trade.entry_time) {
                        entryTimes.push(trade.entry_time);
                        entryPrices.push(trade.entry_price);
                        entryDirections.push(trade.direction);
                    }
                });

                if (entryTimes.length > 0) {
                    // LONG 진입
                    const longEntryTimes = [];
                    const longEntryPrices = [];
                    entryTimes.forEach((time, idx) => {
                        if (entryDirections[idx] === 'long') {
                            longEntryTimes.push(time);
                            longEntryPrices.push(entryPrices[idx]);
                        }
                    });

                    if (longEntryTimes.length > 0) {
                        traces.push({
                            x: longEntryTimes,
                            y: longEntryPrices,
                            mode: 'markers',
                            type: 'scatter',
                            name: 'LONG 진입',
                            marker: {
                                symbol: 'triangle-up',
                                size: 12,
                                color: '#0ecb81',
                                line: { color: '#0a9d6e', width: 2 }
                            }
                        });
                    }

                    // SHORT 진입
                    const shortEntryTimes = [];
                    const shortEntryPrices = [];
                    entryTimes.forEach((time, idx) => {
                        if (entryDirections[idx] === 'short') {
                            shortEntryTimes.push(time);
                            shortEntryPrices.push(entryPrices[idx]);
                        }
                    });

                    if (shortEntryTimes.length > 0) {
                        traces.push({
                            x: shortEntryTimes,
                            y: shortEntryPrices,
                            mode: 'markers',
                            type: 'scatter',
                            name: 'SHORT 진입',
                            marker: {
                                symbol: 'triangle-down',
                                size: 12,
                                color: '#f6465d',
                                line: { color: '#c7364a', width: 2 }
                            }
                        });
                    }
                }

                // 청산 포인트
                const exitTimes = [];
                const exitPrices = [];
                const exitReasons = [];
                trades.forEach(trade => {
                    if (trade.exit_time && trade.exit_price) {
                        exitTimes.push(trade.exit_time);
                        exitPrices.push(trade.exit_price);
                        exitReasons.push(trade.exit_reason);
                    }
                });

                if (exitTimes.length > 0) {
                    traces.push({
                        x: exitTimes,
                        y: exitPrices,

                    showToast('차트 기능은 심볼 1개만 선택했을 때 사용할 수 있습니다.', 'warning');
                }
                
                setLoading(true);
                setResults([]);
                setShowResults(false);

                try {
                    const totalTests = symbolsToTest.length * timeframes.length * selectedStrategies.length;
                    setProgress({ current: 0, total: totalTests, symbol: '', strategy: '' });

                    // 전략별 설정 수집 (EMA Cross 청산 규칙 포함)
                    const strategyConfigsToSend = {};
                    if (selectedStrategies.includes('ema_cross')) {
                        const emaCrossConfig = strategyConfigs['ema_cross'] || {};
                        strategyConfigsToSend['ema_cross'] = {
                            tp1_partial_exit_pct: emaCrossConfig.tp1_partial_exit_pct || 50.0,
                            use_trailing_stop: emaCrossConfig.use_trailing_stop !== false,
                            exit_on_ema50_touch: emaCrossConfig.exit_on_ema50_touch !== false
                        };
                    }
                    
                    const response = await fetch('/api/backtest', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            symbols: symbolsToTest,
                            timeframes: timeframes,
                            strategies: selectedStrategies,
                            start_date: startDate,
                            end_date: endDate,
                            initial_capital: capital,
                            risk_pct: riskPct,
                            leverage: leverage,
                            strategy_configs: strategyConfigsToSend
                        })
                    });

                    if (!response.ok) {
                        throw new Error('백테스트 실패');
                    }

                    // 스트리밍으로 진행상황 받기
                    const reader = response.body.getReader();
                    const decoder = new TextDecoder();
                    let buffer = '';

                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;

                        buffer += decoder.decode(value, { stream: true });
                        const lines = buffer.split('\n');
                        buffer = lines.pop();

                        for (const line of lines) {
                            if (line.startsWith('data: ')) {
                                const data = JSON.parse(line.slice(6));

                                if (data.type === 'progress') {
                                    setProgress({
                                        current: data.current,
                                        total: data.total,
                                        symbol: data.symbol || '',
                                        strategy: data.strategy || ''
                                    });
                                } else if (data.type === 'result') {
                                    setResults(prev => [...prev, data.result]);
                                } else if (data.type === 'error') {
                                    console.error('백테스트 오류:', data);
                                }
                            }
                        }
                    }

                    setShowResults(true);
                } catch (error) {
                    console.error('백테스트 오류:', error);
                    showToast('백테스트 실패: ' + error.message, 'error');
                } finally {
                    setLoading(false);
                }
            };

            // Pattern RAG 학습 실행
            const runPatternRagLearn = async () => {
                setPatternRagLearning(true);
                setPatternRagLearnProgress({ current: 0, total: 0, symbol: '' });

                try {
                    const symbolsToLearn = useTopN
                        ? (topNSelectedSymbols.length > 0 ? topNSelectedSymbols : symbols.slice(0, topN).map(s => s.symbol))
                        : selectedSymbols;

                    const totalSymbols = symbolsToLearn.length * timeframes.length;
                    setPatternRagLearnProgress({ current: 0, total: totalSymbols, symbol: '' });

                    const response = await fetch('/api/pattern_rag/learn', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            symbols: symbolsToLearn,
                            timeframes: timeframes,
                            start_date: startDate,
                            end_date: endDate
                        })
                    });

                    if (!response.ok) {
                        throw new Error('학습 실패');
                    }

                    // 스트리밍으로 진행상황 받기
                    const reader = response.body.getReader();
                    const decoder = new TextDecoder();
                    let buffer = '';
                    let totalPatterns = 0;

                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;

                        buffer += decoder.decode(value, { stream: true });
                        const lines = buffer.split('\n');
                        buffer = lines.pop();

                        for (const line of lines) {
                            if (line.startsWith('data: ')) {
                                const data = JSON.parse(line.slice(6));

                                if (data.type === 'progress') {
                                    setPatternRagLearnProgress({
                                        current: data.current,
                                        total: data.total,
                                        symbol: data.symbol || ''
                                    });
                                } else if (data.type === 'result') {
                                    totalPatterns += data.patterns || 0;
                                } else if (data.type === 'complete') {
                                    showToast(`학습 완료! 총 ${data.total_patterns}개 패턴 저장됨`, 'success', 5000);
                                }
                            }
                        }
                    }
                } catch (error) {
                    console.error('Pattern RAG 학습 오류:', error);
                    showToast('Pattern RAG 학습 실패: ' + error.message, 'error');
                } finally {
                    setPatternRagLearning(false);
                }
            };

            // 결과 정렬 (수익률 높은 순)
            const sortedResults = [...results].sort((a, b) =>
                b.total_pnl_pct - a.total_pnl_pct
            );

            // 필터 조건을 충족하는 결과
            const filteredResults = sortedResults.filter(r =>
                r.total_pnl_pct >= watchFilters.minPnlPct &&
                r.win_rate >= watchFilters.minWinRate &&
                r.profit_factor >= watchFilters.minProfitFactor
            );

            // 감시 심볼에 추가
            const addToWatchList = async () => {
                try {
                    const response = await fetch('/api/backtest/add_to_watch', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            results: filteredResults,
                            min_pnl_pct: watchFilters.minPnlPct,
                            min_win_rate: watchFilters.minWinRate,
                            min_profit_factor: watchFilters.minProfitFactor,
                            notes: `백테스트 ${startDate}~${endDate}, 전략: ${selectedStrategies.join(', ')}`
                        })
                    });

                    const data = await response.json();
                    if (data.success) {
                        showToast(`${data.added}개 심볼 추가됨: ${data.symbols.join(', ')} (전략: ${selectedStrategies.join(', ')})`, 'success', 5000);
                        fetchWatchSymbols();
                    }
                } catch (error) {
                    console.error('심볼 추가 실패:', error);
                    showToast('심볼 추가 실패: ' + error.message, 'error');
                }
            };

            // 개별 심볼 추가

                try {

                    });

                    const data = await response.json();
                    if (data.success) {
                        showToast(`${symbol} (${strategy}) 분석 대상에 추가되었습니다.`, 'success');
                        fetchWatchSymbols();
                    }
                } catch (error) {
                    console.error('심볼 추가 실패:', error);
                    showToast('심볼 추가 실패: ' + error.message, 'error');
                }
            };

            return (
                <div className="min-h-screen bg-gray-100 p-4">
                    {/* Toast 알림 컴포넌트 */}
                    <div className="fixed top-4 right-4 z-50 flex flex-col gap-2">
                        {toasts.map(toast => (
                            <div

                                className={`px-4 py-3 rounded-lg shadow-lg text-white flex items-center gap-3 min-w-[280px] max-w-[400px] animate-slide-in ${
                                    toast.type === 'success' ? 'bg-green-600' :
                                    toast.type === 'error' ? 'bg-red-600' :
                                    toast.type === 'warning' ? 'bg-yellow-600' :
                                    'bg-blue-600'
                                }`}
                            >
                                <span className="text-lg">
                                    {toast.type === 'success' ? '✓' :
                                     toast.type === 'error' ? '✕' :
                                     toast.type === 'warning' ? '⚠' : 'ℹ'}
                                </span>
                                <span className="flex-1 text-sm">{toast.message}</span>
                                <button
                                    onClick={() => removeToast(toast.id)}

                                >
                                    ×
                                </button>
                            </div>
                        ))}
                    </div>

                    <div className="max-w-7xl mx-auto">

                                </div>
                                <button

                                                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />

                                                                : 'bg-gray-300 text-gray-500 cursor-not-allowed'
                                                        }`}
                                                    >
                                                        {filteredResults.length}개 추가
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                )}

                                {/* 결과 목록 */}
                                <div className="flex-1 overflow-y-auto p-6">
                                    <div className="space-y-4">
                                        {sortedResults.map((result, idx) => (
                                            <ResultCard key={idx} result={result} rank={idx + 1} onAddToWatch={addSingleSymbolToWatch} />
                                        ))}

                        </div>
                    )}

                    {/* Watch Symbols 모달 */}
                    {showWatchModal && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
                            <div className="bg-white rounded-lg shadow-2xl max-w-2xl w-full max-h-[80vh] overflow-hidden flex flex-col">
                                <div className="bg-gradient-to-r from-purple-600 to-pink-600 text-white p-6 flex justify-between items-center">
                                    <h2 className="text-2xl font-bold">👁️ 분석 대상 심볼</h2>
                                    <button
                                        onClick={() => setShowWatchModal(false)}

                                    >
                                        ✕
                                    </button>
                                </div>

                                <div className="flex-1 overflow-y-auto p-6">
                                    {watchSymbols.length === 0 ? (
                                        <div className="text-center text-gray-500 py-8">
                                            <p className="text-4xl mb-4">📭</p>
                                            <p>분석 대상 심볼이 없습니다.</p>
                                            <p className="text-sm">백테스트 결과에서 심볼을 추가하세요.</p>
                                        </div>
                                    ) : (
                                        <div className="space-y-2">

                                                    <div>
                                                        <div className="flex items-center gap-2">
                                                            <span className="font-bold">{s.symbol}</span>
                                                            <span className="text-xs text-gray-500">({s.source})</span>
                                                        </div>
                                                        {s.strategies && (
                                                            <div className="flex gap-1 mt-1">
                                                                {s.strategies.split(',').map((strat, i) => (
                                                                    <span key={i} className="text-xs px-2 py-0.5 bg-blue-100 text-blue-800 rounded-full">
                                                                        {strat}
                                                                    </span>
                                                                ))}
                                                            </div>
                                                        )}
                                                        {s.notes && <p className="text-xs text-gray-400 mt-1">{s.notes}</p>}
                                                    </div>
                                                    <button
                                                        onClick={async () => {
                                                            await fetch(`/api/watch_symbols/${s.symbol}`, { method: 'DELETE' });
                                                            fetchWatchSymbols();
                                                        }}
                                                        className="text-red-500 hover:text-red-700"
                                                    >
                                                        ✕
                                                    </button>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* 차트 모달 */}
                    {showChart && selectedResultForChart && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
                            <div className="bg-white rounded-lg shadow-2xl max-w-7xl w-full max-h-[95vh] overflow-hidden flex flex-col">
                                <div className="bg-gradient-to-r from-green-600 to-blue-600 text-white p-5 flex justify-between items-center">
                                    <h2 className="text-xl font-bold">
                                        📈 {selectedResultForChart.symbol} {selectedResultForChart.tf} - {selectedResultForChart.strategy}
                                    </h2>
                                    <button
                                        onClick={() => {
                                            setShowChart(false);
                                            setSelectedResultForChart(null);
                                            setChartData(null);
                                        }}
                                        className="text-white hover:text-gray-200 text-2xl font-bold"
                                    >
                                        ✕
                                    </button>
                                </div>

                                <div className="flex-1 overflow-y-auto p-6">
                                    {chartData ? (
                                        <div className="space-y-4">
                                            {/* 차트 */}
                                            <div className="bg-white border rounded-lg p-4">
                                                <div id="backtest-chart" style={{ width: '100%', height: '600px', minHeight: '600px' }}></div>
                                            </div>

                                            {/* 거래 테이블 */}
                                            {selectedResultForChart.trades && selectedResultForChart.trades.length > 0 && (
                                                <div className="bg-white border rounded-lg p-4">
                                                    <h3 className="text-lg font-bold mb-4">📋 거래 내역</h3>
                                                    <div className="overflow-x-auto">
                                                        <table className="w-full text-sm">
                                                            <thead className="bg-gray-100">
                                                                <tr>
                                                                    <th className="px-3 py-2 text-left">진입 시간</th>
                                                                    <th className="px-3 py-2 text-left">진입가</th>
                                                                    <th className="px-3 py-2 text-left">방향</th>
                                                                    <th className="px-3 py-2 text-left">청산 시간</th>
                                                                    <th className="px-3 py-2 text-left">청산가</th>
                                                                    <th className="px-3 py-2 text-left">청산 사유</th>
                                                                    <th className="px-3 py-2 text-right">PnL</th>
                                                                    <th className="px-3 py-2 text-right">PnL %</th>
                                                                </tr>
                                                            </thead>
                                                            <tbody>
                                                                {selectedResultForChart.trades.map((trade, idx) => (
                                                                    <tr key={idx} className={`border-b ${trade.pnl >= 0 ? 'bg-green-50' : 'bg-red-50'}`}>
                                                                        <td className="px-3 py-2">{new Date(trade.entry_time).toLocaleString('ko-KR')}</td>
                                                                        <td className="px-3 py-2 font-mono">${trade.entry_price.toFixed(2)}</td>
                                                                        <td className="px-3 py-2">
                                                                            <span className={`px-2 py-1 rounded text-xs font-bold ${
                                                                                trade.direction === 'long' ? 'bg-blue-100 text-blue-800' : 'bg-red-100 text-red-800'
                                                                            }`}>
                                                                                {trade.direction === 'long' ? 'LONG' : 'SHORT'}
                                                                            </span>
                                                                        </td>
                                                                        <td className="px-3 py-2">{trade.exit_time ? new Date(trade.exit_time).toLocaleString('ko-KR') : '-'}</td>
                                                                        <td className="px-3 py-2 font-mono">${trade.exit_price ? trade.exit_price.toFixed(2) : '-'}</td>
                                                                        <td className="px-3 py-2">
                                                                            <span className="text-xs px-2 py-1 bg-gray-200 rounded">
                                                                                {trade.exit_reason || '-'}
                                                                            </span>
                                                                        </td>
                                                                        <td className={`px-3 py-2 text-right font-mono font-bold ${
                                                                            trade.pnl >= 0 ? 'text-green-600' : 'text-red-600'
                                                                        }`}>
                                                                            {trade.pnl !== null ? (trade.pnl >= 0 ? '+' : '') + trade.pnl.toFixed(2) : '-'}
                                                                        </td>
                                                                        <td className={`px-3 py-2 text-right font-mono font-bold ${
                                                                            trade.pnl_pct >= 0 ? 'text-green-600' : 'text-red-600'
                                                                        }`}>
                                                                            {trade.pnl_pct !== null ? (trade.pnl_pct >= 0 ? '+' : '') + trade.pnl_pct.toFixed(2) + '%' : '-'}
                                                                        </td>
                                                                    </tr>
                                                                ))}
                                                            </tbody>
                                                        </table>
                                                    </div>
                                                </div>
                                            )}
                                        </div>
                                    ) : (
                                        <div className="text-center py-8">
                                            <div className="animate-spin text-4xl mb-4">⏳</div>
                                            <p>차트 데이터 로딩 중...</p>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* 전략 설정 모달 */}
                    {showStrategySettings && editingStrategyConfig && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
                            <div className="bg-white rounded-lg shadow-2xl max-w-lg w-full max-h-[85vh] overflow-hidden flex flex-col">
                                <div className="bg-gradient-to-r from-blue-600 to-purple-600 text-white p-5 flex justify-between items-center">
                                    <h2 className="text-xl font-bold">⚙️ {editingStrategyConfig} 설정</h2>
                                    <button
                                        onClick={() => {
                                            setShowStrategySettings(false);
                                            setEditingStrategyConfig(null);
                                        }}
                                        className="text-white hover:text-gray-200 text-2xl font-bold"
                                    >
                                        ✕
                                    </button>
                                </div>

                                <div className="flex-1 overflow-y-auto p-6">
                                    {Object.keys(getStrategyParams(editingStrategyConfig)).length > 0 ? (
                                        <StrategyConfigForm
                                            strategyName={editingStrategyConfig}
                                            params={getStrategyParams(editingStrategyConfig)}
                                            currentConfig={strategyConfigs[editingStrategyConfig] || {}}
                                            onSave={(config) => {
                                                saveStrategyConfig(editingStrategyConfig, config);
                                                setShowStrategySettings(false);
                                                setEditingStrategyConfig(null);
                                            }}
                                            onCancel={() => {
                                                setShowStrategySettings(false);
                                                setEditingStrategyConfig(null);
                                            }}
                                        />
                                    ) : (
                                        <div className="text-center text-gray-500 py-8">
                                            <p>이 전략의 설정 폼이 정의되지 않았습니다.</p>
                                            <p className="text-sm mt-2">스키마 로딩 중이거나 정의되지 않았습니다.</p>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // 전략 설정 폼 컴포넌트
        function StrategyConfigForm({ strategyName, params, currentConfig, onSave, onCancel }) {
            const [formData, setFormData] = useState(() => {
                const initial = {};
                // params에 있는 모든 키에 대해 초기화
                Object.keys(params).forEach(key => {
                    initial[key] = currentConfig[key] !== undefined ? currentConfig[key] : params[key].default;
                });
                // enabled가 스키마에 없더라도(혹은 누락) UI에서 토글 가능하도록 기본값 부여
                if (initial.enabled === undefined && currentConfig?.enabled !== undefined) {
                    initial.enabled = currentConfig.enabled;
                }
                if (initial.enabled === undefined) {
                    initial.enabled = true;
                }
                // EMA Cross 청산 규칙 기본값 보장
                if (strategyName === 'ema_cross') {
                    if (initial.tp1_partial_exit_pct === undefined) initial.tp1_partial_exit_pct = 50.0;
                    if (initial.use_trailing_stop === undefined) initial.use_trailing_stop = true;
                    if (initial.exit_on_ema50_touch === undefined) initial.exit_on_ema50_touch = true;
                }
                return initial;
            });

            const handleChange = (key, value, type) => {
                let parsedValue = value;
                if (type === 'number') {
                    parsedValue = parseFloat(value);
                } else if (type === 'checkbox') {
                    parsedValue = value;
                }
                setFormData(prev => ({ ...prev, [key]: parsedValue }));
            };

            const handleSubmit = () => {
                onSave(formData);
            };

            const handleReset = () => {
                const defaults = {};
                Object.keys(params).forEach(key => {
                    defaults[key] = params[key].default;
                });
                setFormData(defaults);
            };

            // EMA Cross 청산 규칙 설정 키 목록
            const emaCrossExitKeys = ['tp1_partial_exit_pct', 'use_trailing_stop', 'exit_on_ema50_touch'];
            const isEmaCross = strategyName === 'ema_cross';
            
            // EMA Cross인 경우 기본값에서 청산 규칙 추가 보장 (params 객체 직접 수정)
            if (isEmaCross) {
                // defaultStrategyParams는 BacktestApp 컴포넌트 스코프에 있으므로 직접 참조 불가
                // 대신 getStrategyParams를 통해 가져온 params에 청산 규칙이 없으면 추가
                const defaultEmaCrossParams = {
                    tp1_partial_exit_pct: { label: 'TP1 부분 청산 비율 (%)', type: 'number', min: 0, max: 100, step: 5, default: 50.0 },
                    use_trailing_stop: { label: 'TP2 트레일링 스톱 사용', type: 'checkbox', default: true },
                    exit_on_ema50_touch: { label: 'EMA50 터치 시 청산', type: 'checkbox', default: true }
                };
                emaCrossExitKeys.forEach(key => {
                    if (!params[key] && defaultEmaCrossParams[key]) {
                        params[key] = defaultEmaCrossParams[key];
                    }
                });
            }
            
            // 일반 설정과 청산 규칙 설정 분리
            const regularParams = Object.entries(params).filter(([key]) => 
                key !== 'enabled' && (!isEmaCross || !emaCrossExitKeys.includes(key))
            );
            const exitParams = isEmaCross ? Object.entries(params).filter(([key]) => 
                emaCrossExitKeys.includes(key)
            ) : [];

            return (
                <div className="space-y-4">
                    {/* tradeBot 스타일: Enabled 토글을 상단에 고정 */}
                    <div className="flex items-center justify-between p-3 rounded-lg border border-gray-200 bg-gray-50">
                        <div>
                            <div className="text-sm font-bold text-gray-800">Enabled</div>
                            <div className="text-xs text-gray-500">OFF이면 백테스트/분석에서 이 전략은 실행되지 않습니다.</div>
                        </div>
                        <label className="flex items-center gap-2 cursor-pointer select-none">
                            <span className={`text-xs font-bold ${formData.enabled ? 'text-green-700' : 'text-red-700'}`}>
                                {formData.enabled ? 'ON' : 'OFF'}
                            </span>
                            <input
                                type="checkbox"
                                checked={!!formData.enabled}
                                onChange={(e) => handleChange('enabled', e.target.checked, 'checkbox')}
                                className="w-5 h-5"
                            />
                        </label>
                    </div>

                    {/* 일반 설정 */}
                    {regularParams.map(([key, config]) => (
                        <div key={key} className="flex items-center justify-between py-2 border-b border-gray-100">
                            <label className="text-sm font-medium text-gray-700">{config.label}</label>

                            {config.type === 'checkbox' ? (
                                <input
                                    type="checkbox"
                                    checked={formData[key]}
                                    onChange={(e) => handleChange(key, e.target.checked, 'checkbox')}
                                    className="w-5 h-5"
                                />
                            ) : config.type === 'select' ? (
                                <select
                                    value={formData[key]}
                                    onChange={(e) => handleChange(key, e.target.value, 'select')}
                                    className="px-3 py-1.5 border rounded-lg text-sm w-32"
                                >
                                    {config.options.map(opt => (
                                        <option key={opt} value={opt}>{opt}</option>
                                    ))}
                                </select>
                            ) : (
                                <input
                                    type="number"
                                    value={formData[key]}
                                    onChange={(e) => handleChange(key, e.target.value, 'number')}
                                    min={config.min}
                                    max={config.max}
                                    step={config.step}
                                    className="px-3 py-1.5 border rounded-lg text-sm w-32 text-right"
                                />
                            )}
                        </div>
                    ))}

                    {/* EMA Cross 청산 규칙 설정 섹션 */}
                    {isEmaCross && exitParams.length > 0 && (
                        <div className="mt-6 pt-4 border-t-2 border-blue-200">
                            <div className="mb-3">
                                <h3 className="text-sm font-bold text-blue-700 mb-1">🔄 청산 규칙 설정</h3>
                                <p className="text-xs text-gray-500">TP1 부분 청산, TP2 트레일링 스톱, EMA50 터치 청산 설정</p>
                            </div>
                            {exitParams.map(([key, config]) => (
                                <div key={key} className="flex items-center justify-between py-2 border-b border-gray-100">
                                    <label className="text-sm font-medium text-gray-700">{config.label}</label>

                                    {config.type === 'checkbox' ? (
                                        <input
                                            type="checkbox"
                                            checked={formData[key]}
                                            onChange={(e) => handleChange(key, e.target.checked, 'checkbox')}
                                            className="w-5 h-5"
                                        />
                                    ) : (
                                        <input
                                            type="number"
                                            value={formData[key]}
                                            onChange={(e) => handleChange(key, e.target.value, 'number')}
                                            min={config.min}
                                            max={config.max}
                                            step={config.step}
                                            className="px-3 py-1.5 border rounded-lg text-sm w-32 text-right"
                                        />
                                    )}
                                </div>
                            ))}
                        </div>
                    )}

                    <div className="flex justify-between pt-4 border-t">
                        <button
                            onClick={handleReset}
                            className="px-4 py-2 text-sm text-gray-600 hover:text-gray-800 border rounded-lg"
                        >
                            기본값 복원
                        </button>
                        <div className="flex gap-2">
                            <button
                                onClick={onCancel}
                                className="px-4 py-2 text-sm text-gray-600 hover:text-gray-800 border rounded-lg"
                            >
                                취소
                            </button>
                            <button
                                onClick={handleSubmit}
                                className="px-4 py-2 text-sm text-white rounded-lg"
                                style={{ background: '#c99a09' }}
                            >
                                저장
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        // 차트 표시 함수 (전역으로 노출)
        window.showChartModal = (result) => {
            // BacktestApp 컴포넌트의 상태 업데이트를 위해 이벤트 사용
            window.dispatchEvent(new CustomEvent('showChart', { detail: result }));
        };

        // 결과 카드 컴포넌트
        function ResultCard({ result, rank, onAddToWatch }) {
            const [expanded, setExpanded] = useState(false);

            // 전략별 색상
            const strategyColors = {
                'keltner_ict_turtle': 'bg-purple-100 text-purple-800',
                'ema_cross': 'bg-blue-100 text-blue-800',
                'ict': 'bg-green-100 text-green-800',
                'rsi': 'bg-yellow-100 text-yellow-800',
                'bollinger': 'bg-red-100 text-red-800'
            };

            return (
                <div className="bg-white border-2 border-gray-200 rounded-lg shadow hover:shadow-lg transition">
                    {/* 요약 */}
                    <div
                        onClick={() => setExpanded(!expanded)}
                        className="p-4 cursor-pointer"
                    >
                        <div className="flex items-center justify-between">
                            <div className="flex items-center space-x-4">
                                {rank <= 3 && (
                                    <div className="text-2xl">
                                        {rank === 1 ? '🥇' : rank === 2 ? '🥈' : '🥉'}
                                    </div>
                                )}
                                <div>
                                    <div className="flex items-center gap-2">
                                        <h4 className="text-xl font-bold">{result.symbol}</h4>
                                        <span className="text-sm text-gray-500">{result.tf}</span>
                                        <span className={`text-xs px-2 py-0.5 rounded-full ${strategyColors[result.strategy] || 'bg-gray-100'}`}>
                                            {result.strategy}
                                        </span>
                                    </div>
                                    <p className="text-sm text-gray-600">
                                        {result.start_date} ~ {result.end_date}
                                    </p>
                                </div>
                            </div>
                            <div className="flex items-center gap-4">
                                <div className="text-right">
                                    <div className={`text-3xl font-bold ${
                                        result.total_pnl_pct > 0 ? 'text-green-600' : 'text-red-600'
                                    }`}>
                                        {result.total_pnl_pct > 0 ? '+' : ''}{result.total_pnl_pct.toFixed(2)}%
                                    </div>
                                    <div className="text-sm text-gray-600">
                                        ${result.total_pnl.toFixed(2)}
                                    </div>
                                </div>
                                <div className="flex items-center gap-2">
                                    {/* 차트 버튼 (심볼 하나만 선택했을 때만 표시) */}
                                    {result.trades && result.trades.length > 0 && (
                                        <button
                                            onClick={(e) => {
                                                e.stopPropagation();
                                                if (window.showChartModal) {
                                                    window.showChartModal(result);
                                                }
                                            }}
                                            className="px-3 py-2 bg-green-500 text-white rounded-lg hover:bg-green-600 text-sm font-medium"
                                            title="차트 보기"
                                        >
                                            📈 차트
                                        </button>
                                    )}
                                    <button
                                        onClick={(e) => {
                                            e.stopPropagation();
                                            onAddToWatch(result.symbol, result.strategy);
                                        }}
                                        className="px-3 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 text-sm font-medium"
                                        title="분석 대상에 추가"
                                    >
                                        + 추가
                                    </button>
                                </div>
                            </div>
                        </div>

                        {/* 주요 지표 */}
                        <div className="grid grid-cols-5 gap-4 mt-4">
                            <div>
                                <div className="text-xs text-gray-600">승률</div>
                                <div className="font-bold">{result.win_rate.toFixed(1)}%</div>
                            </div>
                            <div>
                                <div className="text-xs text-gray-600">총 거래</div>
                                <div className="font-bold">{result.total_trades}</div>
                            </div>
                            <div>
                                <div className="text-xs text-gray-600">샤프</div>
                                <div className="font-bold">{result.sharpe_ratio.toFixed(2)}</div>
                            </div>
                            <div>
                                <div className="text-xs text-gray-600">MDD</div>
                                <div className="font-bold text-red-600">{result.max_drawdown_pct.toFixed(2)}%</div>
                            </div>
                            <div>
                                <div className="text-xs text-gray-600">PF</div>
                                <div className="font-bold">{result.profit_factor.toFixed(2)}</div>
                            </div>
                        </div>
                    </div>

                    {/* 상세 정보 */}
                    {expanded && (
                        <div className="border-t p-4 bg-gray-50">
                            <div className="grid grid-cols-2 gap-6">
                                <div>
                                    <h5 className="font-bold mb-2">📊 거래 통계</h5>
                                    <div className="space-y-1 text-sm">
                                        <div className="flex justify-between">
                                            <span className="text-gray-600">승리/패배:</span>
                                            <span className="font-medium">{result.winning_trades} / {result.losing_trades}</span>
                                        </div>
                                        <div className="flex justify-between">
                                            <span className="text-gray-600">평균 수익:</span>
                                            <span className="font-medium text-green-600">${result.avg_win.toFixed(2)}</span>
                                        </div>
                                        <div className="flex justify-between">
                                            <span className="text-gray-600">평균 손실:</span>
                                            <span className="font-medium text-red-600">${result.avg_loss.toFixed(2)}</span>
                                        </div>
                                        <div className="flex justify-between">
                                            <span className="text-gray-600">최대 수익:</span>
                                            <span className="font-medium text-green-600">${result.max_win.toFixed(2)}</span>
                                        </div>
                                        <div className="flex justify-between">
                                            <span className="text-gray-600">최대 손실:</span>
                                            <span className="font-medium text-red-600">${result.max_loss.toFixed(2)}</span>
                                        </div>
                                    </div>
                                </div>
                                <div>
                                    <h5 className="font-bold mb-2">💰 자본 변화</h5>
                                    <div className="space-y-1 text-sm">
                                        <div className="flex justify-between">
                                            <span className="text-gray-600">초기 자본:</span>
                                            <span className="font-medium">${result.initial_capital.toFixed(2)}</span>
                                        </div>
                                        <div className="flex justify-between">
                                            <span className="text-gray-600">최종 자본:</span>
                                            <span className="font-medium">${result.final_capital.toFixed(2)}</span>
                                        </div>
                                        <div className="flex justify-between">
                                            <span className="text-gray-600">최대 낙폭:</span>
                                            <span className="font-medium text-red-600">${result.max_drawdown.toFixed(2)}</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // 앱 렌더링
        ReactDOM.render(<BacktestApp />, document.getElementById('root'));
    </script>
</body>
</html>
